<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome Home</title>
<style>
/* Designed for a TV: dark neutral base, off-white text, one calm accent, ~5% safe margins, big type, strong focus ring. */
:root{--bg:#12161C;--s1:#1B212A;--s2:#232B36;--fg:#E8EAED;--mut:#A9B1BC;--acc:#8AB4F8;--up:#F28B82;--dn:#81C995;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto auto auto;gap:1.3vw;padding:2.2vw 4.5vw 0}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.top .dt{white-space:nowrap;text-align:right;font-size:2.1vw;color:var(--mut)}
.hello{display:flex;justify-content:center;align-items:center;gap:1vw;font-size:3.2vw;font-weight:500;letter-spacing:.01em}
.hello #c{font-variant-numeric:tabular-nums}.hello .em{font-size:3.4vw;line-height:1}
.main{display:grid;grid-template-columns:.7fr 1.6fr;gap:1.5vw;min-height:0}
.tile{background:var(--s1);border-radius:1.2vw;padding:1.4vw 1.8vw;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:0;overflow:hidden}
.welcome h1{margin:0;font-size:2.7vw;font-weight:500;line-height:1.2}
.welcome .clk{font-size:5vw;font-weight:300;margin-top:.6vw;font-variant-numeric:tabular-nums;line-height:1.1}
.welcome .dt{font-size:2vw;color:var(--mut);margin-top:.5vw}
.today .ic{font-size:3.4vw;line-height:1.1}
.today .t{font-size:3.4vw;font-weight:300;line-height:1.1}
.today .l{font-size:1.9vw;color:var(--mut);margin-top:.4vw}
.verse{align-items:flex-start;text-align:left}
.verse .lab{font-size:1.5vw;color:var(--acc);letter-spacing:.08em;text-transform:uppercase;font-weight:500;margin-bottom:.6vw}
.verse{justify-content:flex-start}.verse .tx{font-size:2.2vw;line-height:1.35;flex:1 1 0;min-height:0;width:100%;overflow:hidden}
.verse .ref{font-size:1.8vw;color:var(--mut);margin-top:.6vw}
.apps{display:flex;justify-content:center;gap:5vw}
.app{width:10vw;height:10vw;background:transparent;border:0;border-radius:1.6vw;color:var(--fg);font:inherit;font-size:2vw;cursor:pointer;overflow:hidden;padding:0;transition:transform .12s;display:flex;align-items:center;justify-content:center;background:var(--s2)}
.app img{width:100%;height:100%;object-fit:contain;display:block}
.app:focus{outline:.35vw solid var(--fg);outline-offset:.35vw;transform:scale(1.06)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:1vw}
.d{background:var(--s1);border-radius:1vw;padding:.6vw .4vw;text-align:center}
.d.now{background:var(--s2);box-shadow:inset 0 -.25vw 0 var(--acc)}
.d b{display:block;font-weight:500;font-size:1.9vw;color:var(--mut)}
.d i{display:block;font-style:normal;font-size:2.3vw;line-height:1.2}
.d span{font-size:2vw;font-weight:500}.d span em{font-style:normal;font-weight:400;color:var(--mut)}
.tick{margin:0 -4.5vw;background:var(--s1);height:4.6vw;overflow:hidden;display:flex;align-items:center;white-space:nowrap}
.track{display:inline-block;padding-left:100%;animation:sc 45s linear infinite}
.track>span{display:inline-block;font-size:2.1vw;margin-right:5vw}.track span{font-size:2.1vw}
.track .nm{color:var(--mut);margin-right:.7vw;font-weight:500}
.track .up{color:var(--up)}.track .dn{color:var(--dn)}.track .na{color:var(--mut)}
@keyframes sc{from{transform:translateX(0)}to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.track{animation:none;padding-left:4.5vw}}
</style></head><body>
<div id="app">
  <div class="top"><div></div><div class="hello"><span id="c"></span><span class="em" id="em"></span><span id="gr"></span></div><div class="dt" id="dt"></div></div>
  <div class="main">
    <div class="tile today"><div class="ic" id="ti">…</div><div class="t" id="tt"></div><div class="l" id="tl"></div></div>
    <div class="tile verse"><div class="lab">Verse of the day · NASB</div><div class="tx" id="vt">…</div><div class="ref" id="vr"></div></div>
  </div>
  <div class="apps">
    <button class="app" id="yt" data-app="youtube"><span>YouTube</span></button>
    <button class="app" id="bv" data-app="bluevod"><span>BlueVod</span></button>
  </div>
  <div class="days" id="days"></div>
  <div class="tick"><div class="track" id="tr"></div></div>
</div>
<script>
// ===== EASY-TO-EDIT SETTINGS =====
const CFG={
  place:{name:'Milton, FL',lat:30.6324,lon:-87.0397,tz:'America/Chicago'},   // after the move: Cantonment, FL  lat 30.6091  lon -87.3375  (same time zone)
  verseVersion:'NASB'
};
// ==================================
const $=id=>document.getElementById(id),TZ=CFG.place.tz;
const hasA=()=>!!window.Android&&typeof Android.fetchText==='function';
let seq=0;
// Fetch any URL as text: natively inside the app (no browser restrictions), plain fetch() as a fallback in a normal browser.
function get(u){return new Promise(res=>{
  if(hasA()){const n='__cb'+(++seq);const t=setTimeout(()=>{delete window[n];res('')},20000);window[n]=s=>{clearTimeout(t);delete window[n];res(s||'')};Android.fetchText(u,n)}
  else fetch(u).then(r=>r.text()).then(res).catch(()=>res(''))})}
const ls={g(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const strip=h=>h.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/\s+/g,' ');
const unesc=s=>{const t=document.createElement('textarea');t.innerHTML=s;return t.value};

// ---- clock + greeting (always in the home time zone) ----
function tick(){const n=new Date();
 const h=+new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',hour12:false}).format(n)%24;
 const m=h>=5&&h<12?['🌅','Good morning, Master Keely']:h>=12&&h<17?['☀️','Good afternoon, Master Keely']:['🌙','Good evening, Master Keely'];
 $('em').textContent=m[0];$('gr').textContent=m[1];
 $('c').textContent=n.toLocaleTimeString('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'});
 $('dt').textContent=n.toLocaleDateString('en-US',{timeZone:TZ,weekday:'short',month:'short',day:'numeric'})}
tick();setInterval(tick,5000);

// ---- weather (Open-Meteo, fixed location) ----
const WX=c=>c===0?['☀️','Clear']:c===1?['🌤️','Mostly clear']:c===2?['⛅','Partly cloudy']:c===3?['☁️','Cloudy']:c<=48?['🌫️','Fog']:c<=57?['🌦️','Drizzle']:c<=67?['🌧️','Rain']:c<=77?['❄️','Snow']:c<=82?['🌦️','Showers']:['⛈️','Storms'];
async function weather(){
 const p=CFG.place,u=`https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=${encodeURIComponent(p.tz)}&forecast_days=7`;
 try{const j=JSON.parse(await get(u));ls.s('wx',j);drawWx(j)}catch(e){const j=ls.g('wx');if(j)drawWx(j)}}
function drawWx(j){const c=WX(j.current.weather_code),d=j.daily;
 $('ti').textContent=c[0];$('tt').textContent=Math.round(j.current.temperature_2m)+'°';$('tl').innerHTML=c[1]+'<br>H '+Math.round(d.temperature_2m_max[0])+'°  L '+Math.round(d.temperature_2m_min[0])+'°';
 $('days').innerHTML=d.time.map((t,i)=>`<div class="d${i?'':' now'}"><b>${i?new Date(t+'T12:00:00Z').toLocaleDateString('en-US',{timeZone:'UTC',weekday:'short'}):'Today'}</b><i>${WX(d.weather_code[i])[0]}</i><span>${Math.round(d.temperature_2m_max[i])}° <em>${Math.round(d.temperature_2m_min[i])}°</em></span></div>`).join('')}

// ---- verse of the day (BibleGateway, NASB) ----
function fitVerse(){const tx=$('vt');let f=2.3;tx.style.fontSize=f+'vw';while(f>1.2&&tx.scrollHeight>tx.clientHeight+1){f-=.05;tx.style.fontSize=f+'vw'}}
function showVerse(t,r){if(!t)return;$('vt').textContent=t;$('vr').textContent=r||'';fitVerse();setTimeout(fitVerse,300)}
addEventListener('resize',fitVerse);
async function verse(){
 const day=new Date().toLocaleDateString('en-CA',{timeZone:TZ}),c=ls.g('verse');
 if(c&&c.day===day){showVerse(c.t,c.r);return}
 let t='',r='';
 // 1) JSON endpoint
 try{const j=JSON.parse(await get('https://www.biblegateway.com/votd/get/?format=json&version='+CFG.verseVersion));const v=j.votd||j;
  t=strip(unesc(v.text||v.content||'')).replace(/[“”"]/g,m=>m).trim();r=(v.reference||v.display_ref||'').trim()}catch(e){}
 // 2) RSS feed fallback (NASB id 49 is a best guess; adjust here if the version looks wrong)
 if(!t){try{const x=await get('https://www.biblegateway.com/usage/votd/rss/votd.rdf?49');
  const m=x.match(/<content:encoded>([\s\S]*?)<\/content:encoded>/i),ti=x.match(/<item>[\s\S]*?<title>([\s\S]*?)<\/title>/i);
  if(m){t=strip(unesc(m[1].replace(/<!\[CDATA\[|\]\]>/g,''))).trim();r=ti?strip(unesc(ti[1])).trim():''}}catch(e){}}
 t=t.replace(/\s+-\s+New American Standard.*$/i,'').replace(/^[“"]|[”"]$/g,'').trim();
 if(t){ls.s('verse',{day,t,r});showVerse(t,r)}else if(c)showVerse(c.t,c.r);else{$('vt').textContent='Verse unavailable right now.';$('vr').textContent=''}}

// ---- ammo ticker ----
// source A: FirearmDataLab median in-stock price per round (live). source B: weekly "Price Tracker: AMMO" table (has a year-ago column).
const AMMO=[
 {k:'buck',name:'00 BUCK',a:[],row:/00\s*Buck/i},
 {k:'3006',name:'30-06',a:['https://firearmdatalab.com/ammo/30-06/'],row:/30-06/i},
 {k:'9mm',name:'9MM',a:['https://firearmdatalab.com/ammo/9mm/','https://firearmdatalab.com/ammo/9mm-luger/'],row:/9mm/i}];
const TRACKER='https://againstthetread.beehiiv.com/p/price-tracker-ammo';
function parseMedian(h){const t=strip(h);const m=t.match(/median[^$¢]{0,220}?(?:\$\s?(\d+(?:\.\d+)?)|(\d+(?:\.\d+)?)\s?¢)/i);
 if(!m)return null;const v=m[1]?+m[1]:+m[2]/100;return v>0&&v<20?v:null}
function parseRow(t,re){const m=t.match(new RegExp(re.source+'[^$]{0,25}\\$\\s?(\\d+\\.\\d+)[^$]{0,25}\\$\\s?(\\d+\\.\\d+)','i'));return m?{cur:+m[1],ago:+m[2]}:null}
async function ammo(){
 let hist=ls.g('ammo')||{};let tr=null;
 try{tr=strip(await get(TRACKER))}catch(e){}
 for(const a of AMMO){let v=null,src='',ago=null;
  for(const u of a.a){try{v=parseMedian(await get(u))}catch(e){}if(v){src='fdl';break}}
  const row=tr?parseRow(tr,a.row):null;
  if(row){ago=row.ago;if(!v){v=row.cur;src='att'}}
  if(!v)continue;
  const h=hist[a.k];
  if(!h||h.src!==src)hist[a.k]={src,cur:v,prev:null,ago:src==='att'?ago:null,t:Date.now()};
  else{if(Math.abs(h.cur-v)>=0.005){h.prev=h.cur;h.cur=v}h.ago=src==='att'?ago:null;h.t=Date.now()}}
 ls.s('ammo',hist);drawAmmo(hist)}
function drawAmmo(hist){
 const items=AMMO.map(a=>{const h=hist[a.k];if(!h)return `<span><span class="nm">${a.name}</span><span class="na">— —</span></span>`;
  const ref=h.prev!=null?h.prev:(h.src==='att'?h.ago:null);let ar='',cl='na',pc='';
  if(ref){const d=h.cur-ref;if(Math.abs(d)>=0.005){ar=d>0?'▲':'▼';cl=d>0?'up':'dn';pc=' '+(d>0?'+':'')+(d/ref*100).toFixed(1)+'%'}else{ar='▬'}}
  return `<span><span class="nm">${a.name}</span><span class="${cl}">$${h.cur.toFixed(2)}/rd ${ar}${pc}</span></span>`}).join('');
 $('tr').innerHTML=items+items}
{const h=ls.g('ammo');if(h)drawAmmo(h);else drawAmmo({})}

// ---- real app artwork from this device ----
function trimmed(img,cb){try{const W=img.naturalWidth,H=img.naturalHeight,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(img,0,0);
 const d=x.getImageData(0,0,W,H).data;let x0=W,x1=-1,y0=H,y1=-1;
 for(let y=0;y<H;y++)for(let q=0;q<W;q++){const i=(y*W+q)*4;if(d[i+3]>24&&!(d[i]>235&&d[i+1]>235&&d[i+2]>235)){if(q<x0)x0=q;if(q>x1)x1=q;if(y<y0)y0=y;if(y>y1)y1=y}}
 if(x1<=x0||y1<=y0)return cb(img.src);const w=x1-x0+1,h=y1-y0+1,t=document.createElement('canvas');t.width=w;t.height=h;t.getContext('2d').drawImage(c,x0,y0,w,h,0,0,w,h);cb(t.toDataURL('image/png'))}catch(e){cb(img.src)}}
function art(btn,name){try{if(!window.Android||!Android.icon)return;const r=Android.icon(name);if(!r)return;
 const ban=r.startsWith('B:'),img=new Image();img.src='data:image/png;base64,'+r.slice(2);if(!ban)img.className='ic';
 img.onload=()=>{
  if(name==='youtube'){btn.innerHTML='';btn.style.background=ban?'#fff':'transparent';img.style.objectFit=ban?'contain':'cover';btn.appendChild(img);return}
  // BlueVod: cut off the white border and stretch the blue icon to fill the whole tile
  trimmed(img,u=>{const o=new Image();o.onload=()=>{btn.innerHTML='';btn.style.background='transparent';o.style.objectFit='fill';btn.appendChild(o)};o.src=u})}}catch(e){}}
art($('yt'),'youtube');art($('bv'),'bluevod');

// ---- controller / remote focus ----
const NAV={yt:{ArrowRight:'bv'},bv:{ArrowLeft:'yt'}};
document.querySelectorAll('.app').forEach(b=>b.onclick=()=>{if(window.Android)Android.launch(b.dataset.app)});
addEventListener('keydown',e=>{const f=document.activeElement,id=f&&f.id,t=NAV[id]&&NAV[id][e.key];
 if(t){$(t).focus();e.preventDefault()}else if(!id&&e.key.startsWith('Arrow')){$('yt').focus();e.preventDefault()}});
window.onBack=()=>false;   // nothing to close here, so B/Back goes to the Superbox home menu
$('yt').focus();

weather();verse();ammo();
setInterval(weather,30*60*1000);setInterval(verse,60*60*1000);setInterval(ammo,6*60*60*1000);
</script></body></html>
