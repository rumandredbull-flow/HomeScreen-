<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome Home</title>
<style>
:root{--fg:#fff;--mut:rgba(255,255,255,.72);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;color:var(--fg);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:#1b1fd0}
body{background:radial-gradient(120% 90% at 20% 0%,#2a35ff 0,#1a1fc9 40%,#2a158f 100%);overflow:hidden}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto auto auto;gap:clamp(10px,1.6vw,22px);padding:clamp(16px,3vw,44px)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:clamp(14px,1.6vw,22px)}
.logo{font-weight:800;font-size:clamp(20px,2.4vw,34px);letter-spacing:-.01em}
.logo span{opacity:.7;font-weight:600}
.main{display:grid;grid-template-columns:1fr 1fr 1.7fr;gap:clamp(10px,1.6vw,22px);min-height:0}
.tile{border-radius:12px;padding:clamp(14px,2vw,28px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:0;overflow:hidden;box-shadow:0 8px 24px rgba(5,5,60,.35)}
.greet{background:linear-gradient(170deg,#25b4ee 0,#4a67e0 55%,#8a3fd0 100%)}
.greet h1{margin:0;font-size:clamp(20px,2.6vw,40px);line-height:1.08;font-weight:700}
.greet .clk{font-size:clamp(28px,3.6vw,56px);font-weight:300;margin-top:.3em;font-variant-numeric:tabular-nums}
.greet .dt{font-size:clamp(13px,1.5vw,21px);color:var(--mut);margin-top:.4em}
.today{background:linear-gradient(170deg,#b625cf 0,#7a22c8 100%)}
.today .ic{font-size:clamp(48px,7vw,104px);line-height:1}
.today .t{font-size:clamp(40px,6vw,88px);font-weight:300;margin-top:.1em}
.today .l{font-size:clamp(14px,1.7vw,24px);color:var(--mut)}
.radar{position:relative;padding:0;overflow:hidden;background:#0d1230;border:0;color:inherit;font:inherit;cursor:pointer}
.radar canvas{width:100%;height:100%;display:block}
.radar .lab{position:absolute;left:0;right:0;bottom:0;padding:clamp(10px,1.4vw,18px);text-align:left;font-size:clamp(15px,1.8vw,26px);font-weight:600;background:linear-gradient(0deg,rgba(8,10,40,.85),rgba(8,10,40,0))}
.radar:focus-visible,.x:focus-visible{outline:3px solid #fff;outline-offset:3px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(6px,1vw,14px)}
.d{border-radius:10px;background:rgba(255,255,255,.12);padding:clamp(8px,1.2vw,16px) 4px;text-align:center;border:1px solid rgba(255,255,255,.14)}
.d.now{background:linear-gradient(170deg,#18b6a4,#1b8fcf);border-color:transparent}
.d b{display:block;font-weight:600;font-size:clamp(12px,1.4vw,19px)}
.d i{display:block;font-style:normal;font-size:clamp(22px,3vw,44px);margin:.15em 0}
.d span{font-size:clamp(13px,1.5vw,21px);font-weight:600}.d span em{font-style:normal;font-weight:400;color:var(--mut)}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.6vw,22px)}.app{border:0;border-radius:10px;padding:clamp(10px,1.6vw,22px);font:inherit;font-size:clamp(16px,2vw,28px);font-weight:700;color:#fff;cursor:pointer}.app:focus-visible{outline:3px solid #fff;outline-offset:3px}.app,.radar,.x{transition:transform .12s}.radar:focus,.app:focus,.x:focus{outline:4px solid #fff;outline-offset:4px;transform:scale(1.04)}.bar{display:flex;justify-content:space-between;color:var(--mut);font-size:clamp(11px,1.2vw,17px)}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,8,40,.82)}
#ov.on{display:flex}
.card{width:min(94vw,1100px);background:#0d1230;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;font-size:clamp(14px,1.6vw,20px)}
.x{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;padding:.5em 1em;font:inherit;cursor:pointer}
#big{width:100%;aspect-ratio:16/9;display:block}
@media (max-width:820px){body{overflow:auto}#app{height:auto;min-height:100%}.main{grid-template-columns:1fr 1fr}.radar{grid-column:1/-1;aspect-ratio:16/9}.days{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:reduce){.radar canvas{animation:none}}
</style></head><body>
<div id="app">
  <div class="top"><div class="logo">Home<span>Screen</span></div><div id="top"></div></div>
  <div class="main">
    <div class="tile greet"><h1 id="g"></h1><div class="clk" id="c"></div><div class="dt" id="dt"></div></div>
    <div class="tile today"><div class="l">Today</div><div class="ic" id="ti"></div><div class="t" id="tt"></div><div class="l" id="tl"></div></div>
    <button class="tile radar" id="rb" aria-label="Open radar"><canvas id="pv" width="480" height="300"></canvas><div class="lab">Radar</div></button>
  </div>
  <div class="apps"><button class="app" id="yt" data-app="youtube" style="background:linear-gradient(170deg,#e0455f,#b8263f)">YouTube</button><button class="app" id="bv" data-app="bluevod" style="background:linear-gradient(170deg,#18b6a4,#1b8fcf)">BlueVod</button></div><div class="days" id="days"></div>
  <div class="bar"><span>Ⓐ Open radar &nbsp; Ⓑ Back</span><span id="note">Loading weather…</span></div>
</div>
<div id="ov"><div class="card"><header><span><b>Radar</b> · sample animation</span><button class="x" id="x">Ⓑ Close</button></header><canvas id="big" width="960" height="540"></canvas></div></div>
<script>
const $=id=>document.getElementById(id);
function tick(){const n=new Date(),h=n.getHours();
 $('g').innerHTML=(h<12?'Good morning':h<18?'Good afternoon':'Good evening')+'.<br>Welcome home,<br>Master Keely';
 $('c').textContent=n.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
 $('dt').textContent=n.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
 $('top').textContent=n.toLocaleDateString(undefined,{month:'numeric',day:'numeric',year:'numeric'})+'  '+n.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}
tick();setInterval(tick,10000);
// weather: general location from the connection, forecast from Open-Meteo
const E={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌦️',61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'🌨️',80:'🌦️',81:'🌧️',82:'🌧️',95:'⛈️',96:'⛈️',99:'⛈️'};
const L={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Cloudy',45:'Fog',48:'Fog',51:'Drizzle',53:'Drizzle',55:'Drizzle',61:'Rain',63:'Rain',65:'Heavy rain',71:'Snow',73:'Snow',75:'Heavy snow',80:'Showers',81:'Showers',82:'Heavy showers',95:'Storms',96:'Storms',99:'Storms'};
let W=[['☀️',68,49,'Sunny'],['⛅',66,50,'Partly cloudy'],['🌧️',61,47,'Rain'],['🌦️',63,48,'Showers'],['☀️',70,51,'Sunny'],['☀️',72,53,'Sunny'],['⛅',69,52,'Partly cloudy']],loc=null;
function showW(){$('ti').textContent=W[0][0];$('tt').textContent=W[0][1]+'°';$('tl').textContent=W[0][3]+' · low '+W[0][2]+'°';
 $('days').innerHTML=W.map((w,i)=>{const d=new Date();d.setDate(d.getDate()+i);
  return `<div class="d${i?'':' now'}"><b>${i?d.toLocaleDateString(undefined,{weekday:'short'}):'Today'}</b><i>${w[0]}</i><span>${w[1]}° <em>${w[2]}°</em></span></div>`}).join('')}
showW();
async function load(){
 try{
  try{const r=await(await fetch('https://ipwho.is/')).json();if(r.success!==false){loc={lat:r.latitude,lon:r.longitude,name:r.city};localStorage.setItem('loc',JSON.stringify(loc))}}catch(e){}
  if(!loc)loc=JSON.parse(localStorage.getItem('loc')||'null');
  if(!loc)throw 0;
  const j=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto&forecast_days=7`)).json();
  W=j.daily.weather_code.map((k,i)=>[E[k]||'⛅',Math.round(j.daily.temperature_2m_max[i]),Math.round(j.daily.temperature_2m_min[i]),L[k]||'']);
  showW();$('note').textContent='Weather for '+loc.name;loadRadar();
 }catch(e){$('note').textContent='Sample weather · no connection'}}
load();setInterval(load,1800000);
// radar: real RainViewer tiles over a dark map, with the sample animation as fallback
const Z=7,TS=256;let frames=[],view=null;
async function loadRadar(){
 try{
  const m=await(await fetch('https://api.rainviewer.com/public/weather-maps.json')).json();
  const n=2**Z,fx=(loc.lon+180)/360*n,r=loc.lat*Math.PI/180,fy=(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n;
  const x0=Math.floor(fx)-2,y0=Math.floor(fy)-1,grid=[];
  for(let dy=0;dy<3;dy++)for(let dx=0;dx<5;dx++)grid.push([x0+dx,y0+dy,dx,dy]);
  const img=u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=u});
  const cvs=()=>{const c=document.createElement('canvas');c.width=5*TS;c.height=3*TS;return c};
  const bc=cvs(),bx=bc.getContext('2d');
  await Promise.all(grid.map(async([x,y,dx,dy])=>{const i=await img(`https://a.basemaps.cartocdn.com/dark_all/${Z}/${x}/${y}.png`);if(i)bx.drawImage(i,dx*TS,dy*TS)}));
  const fl=await Promise.all(m.radar.past.slice(-8).map(async f=>{const c=cvs(),cx=c.getContext('2d');
   await Promise.all(grid.map(async([x,y,dx,dy])=>{const i=await img(`${m.host}${f.path}/256/${Z}/${x}/${y}/2/1_1.png`);if(i)cx.drawImage(i,dx*TS,dy*TS)}));return{c,t:f.time}}));
  view={bc,px:(fx-x0)*TS,py:(fy-y0)*TS};frames=fl;
 }catch(e){}}
const oc=document.createElement('canvas');oc.width=192;oc.height=108;
const ox=oc.getContext('2d'),img2=ox.createImageData(192,108);
function field(t){const d=img2.data;
 for(let y=0;y<108;y++)for(let x=0;x<192;x++){
  const v=(Math.sin(x*.06+t*.5+Math.sin(y*.05+t*.3)*2)+Math.sin(y*.1-t*.35+Math.sin(x*.04)*2)+Math.sin((x+y)*.045+t*.4))/3;
  const k=(v-.05)/.95,i=(y*192+x)*4;
  if(k<=0){d[i+3]=0;continue}
  d[i]=k<.4?40:k<.7?255:230;d[i+1]=k<.4?200:k<.7?200-(k-.4)*300:60;d[i+2]=k<.4?120:k<.7?40:200;d[i+3]=Math.min(1,k*1.6)*200}
 ox.putImageData(img2,0,0)}
function paint(cv,t){const x=cv.getContext('2d'),w=cv.width,h=cv.height;x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';
 if(view&&frames.length){const f=frames[Math.floor(t/.7)%frames.length],sw=900,sh=sw*h/w,sx=view.px-sw/2,sy=view.py-sh/2;
  x.drawImage(view.bc,sx,sy,sw,sh,0,0,w,h);x.globalAlpha=.85;x.drawImage(f.c,sx,sy,sw,sh,0,0,w,h);x.globalAlpha=1;
  x.fillStyle='#fff';x.font=Math.round(w/36)+'px sans-serif';x.fillText(new Date(f.t*1000).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),w*.03,h*.11);
 }else{const g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#141c40');g.addColorStop(1,'#0b1030');x.fillStyle=g;x.fillRect(0,0,w,h);x.drawImage(oc,0,0,w,h)}
 x.fillStyle='#fff';x.beginPath();x.arc(w/2,h/2,Math.max(3,w/190),0,7);x.fill();
 x.strokeStyle='rgba(255,255,255,.6)';x.beginPath();x.arc(w/2,h/2,w/40+w/120*Math.sin(t*2),0,7);x.stroke()}
// controller: the app maps A to Enter and B to Back; D-pad moves the highlight
const ov=$('ov'),tog=f=>{ov.classList.toggle('on',f);$(f?'x':'rb').focus()};
const launch=n=>{if(window.Android)Android.launch(n)};
$('rb').onclick=()=>tog(true);$('x').onclick=()=>tog(false);$('yt').onclick=()=>launch('youtube');$('bv').onclick=()=>launch('bluevod');
window.onBack=()=>{if(ov.classList.contains('on')){tog(false);return true}return false};
const nav={rb:{ArrowDown:'yt'},yt:{ArrowUp:'rb',ArrowRight:'bv'},bv:{ArrowUp:'rb',ArrowLeft:'yt'},x:{}};
addEventListener('keydown',e=>{
 if(e.key==='Escape'||e.key==='Backspace'){if(!window.onBack()&&window.Android)Android.home();return}
 const n=(nav[document.activeElement.id]||{})[e.key];if(n&&!ov.classList.contains('on')){$(n).focus();e.preventDefault()}});
$('rb').focus();
const t0=performance.now(),still=matchMedia('(prefers-reduced-motion: reduce)').matches;
(function loop(){requestAnimationFrame(loop);const t=still?3:(performance.now()-t0)/1000;
 field(t);paint($('pv'),t);if(ov.classList.contains('on'))paint($('big'),t)})();
</script></body></html>
